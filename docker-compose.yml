services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-rpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: symmetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "5432:5432"
    volumes:
      - symmetry_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 4g
    mem_reservation: 2g
    cpus: 4.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d symmetry"]
      interval: 10s
      timeout: 5s
      retries: 10

  symmetry-api:
    build:
      context: ./backend/symmetry
    container_name: ai-rpg-api
    restart: unless-stopped
    env_file:
      - ./backend/symmetry/.env
    environment:
      SYMMETRY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/symmetry
      SYMMETRY_EMBEDDING_MODEL_DIR: /app/models
      SYMMETRY_EMBEDDING_MODEL: intfloat/multilingual-e5-base
      SYMMETRY_EMBEDDING_BACKEND: onnx
      SYMMETRY_EMBEDDING_MODEL_FILE_NAME: onnx/model.onnx
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      TORCH_NUM_THREADS: "8"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/symmetry/app:/app/app
      - ./backend/symmetry/models:/app/models
      - ./backend/symmetry/alembic:/app/alembic
      - ./backend/symmetry/alembic.ini:/app/alembic.ini
    mem_limit: 5g
    mem_reservation: 2g
    cpus: 6.0

volumes:
  symmetry_postgres_data:
