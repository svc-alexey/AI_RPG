services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-rpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: symmetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "5432:5432"
    volumes:
      - symmetry_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 4g
    mem_reservation: 2g
    cpus: 4.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d symmetry"]
      interval: 10s
      timeout: 5s
      retries: 10

  symmetry-api:
    build:
      context: ./backend/symmetry
    container_name: ai-rpg-api
    restart: unless-stopped
    env_file:
      - ./backend/symmetry/.env
    environment:
      SYMMETRY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/symmetry
      SYMMETRY_EMBEDDING_MODEL_DIR: /app/models
      SYMMETRY_EMBEDDING_MODEL: intfloat/multilingual-e5-base
      SYMMETRY_EMBEDDING_BACKEND: onnx
      SYMMETRY_EMBEDDING_MODEL_FILE_NAME: onnx/model.onnx
      SYMMETRY_WEB_PUBLIC_ORIGIN: http://127.0.0.1:3010
      SYMMETRY_YANDEX_REDIRECT_URI: http://127.0.0.1:3010/v1/auth/yandex/callback
      SYMMETRY_YOOKASSA_RETURN_URL: http://127.0.0.1:3010
      SYMMETRY_YOOKASSA_WEBHOOK_PUBLIC_URL: http://127.0.0.1:3010/v1/billing/webhooks/yookassa
      SYMMETRY_BILLING_FAKE_PROVIDER_ENABLED: "true"
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      TORCH_NUM_THREADS: "8"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./backend/symmetry/app:/app/app
      - ./backend/symmetry/models:/app/models
      - ./backend/symmetry/alembic:/app/alembic
      - ./backend/symmetry/alembic.ini:/app/alembic.ini
    mem_limit: 5g
    mem_reservation: 2g
    cpus: 6.0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 10

  symmetry-worker:
    build:
      context: ./backend/symmetry
    container_name: ai-rpg-worker
    restart: unless-stopped
    command: ["/app/start_worker.sh"]
    env_file:
      - ./backend/symmetry/.env
    environment:
      SYMMETRY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/symmetry
      SYMMETRY_EMBEDDING_MODEL_DIR: /app/models
      SYMMETRY_EMBEDDING_MODEL: intfloat/multilingual-e5-base
      SYMMETRY_EMBEDDING_BACKEND: onnx
      SYMMETRY_EMBEDDING_MODEL_FILE_NAME: onnx/model.onnx
      SYMMETRY_WEB_PUBLIC_ORIGIN: http://127.0.0.1:3010
      SYMMETRY_YANDEX_REDIRECT_URI: http://127.0.0.1:3010/v1/auth/yandex/callback
      SYMMETRY_YOOKASSA_RETURN_URL: http://127.0.0.1:3010
      SYMMETRY_YOOKASSA_WEBHOOK_PUBLIC_URL: http://127.0.0.1:3010/v1/billing/webhooks/yookassa
      SYMMETRY_BILLING_FAKE_PROVIDER_ENABLED: "true"
      OMP_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      TORCH_NUM_THREADS: "8"
    depends_on:
      postgres:
        condition: service_healthy
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./backend/symmetry/app:/app/app
      - ./backend/symmetry/models:/app/models
      - ./backend/symmetry/alembic:/app/alembic
      - ./backend/symmetry/alembic.ini:/app/alembic.ini
      - ./backend/symmetry/start_worker.sh:/app/start_worker.sh
    mem_limit: 4g
    mem_reservation: 2g
    cpus: 4.0

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        AI_PRG_SYMMETRY_BASE_URL: http://127.0.0.1:3010/v1
    container_name: ai-rpg-web
    restart: unless-stopped
    depends_on:
      symmetry-api:
        condition: service_healthy
    ports:
      - "3010:80"
    mem_limit: 2g
    mem_reservation: 512m
    cpus: 2.0

volumes:
  symmetry_postgres_data:
