server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статические legal/catalog страницы — без Flutter SPA
    location ~ ^/(offer|privacy|consent|refunds|contacts|pricing)\.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /legal.css {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.map$ {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    location /v1/ {
        proxy_pass http://symmetry-api:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://symmetry-api:8080/health;
    }

    location = /version {
        proxy_pass http://symmetry-api:8080/version;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
