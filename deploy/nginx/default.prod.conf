server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Gzip compression — dramatically reduces main.dart.js (3.5MB → ~1MB)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/octet-stream
        image/svg+xml;

    # Кэширование статических ресурсов (изображения, шрифты, CSS/JS)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # robots.txt и sitemap.xml — явная отдача
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Type "application/xml";
    }

    # Статические legal/catalog страницы — без Flutter SPA
    location ~ ^/(offer|privacy|consent|refunds|contacts|pricing|subscribe|worlds|world-cybernoir|world-dark-fantasy|world-romance|rpg-with-ai|text-rpg-online|roadmap)\.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Блог — статические HTML, без SPA fallback
    location ~ ^/blog/ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /legal.css {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.map$ {
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    location /v1/ {
        proxy_pass http://symmetry-api:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://symmetry-api:8080/health;
    }

    location = /version {
        proxy_pass http://symmetry-api:8080/version;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
