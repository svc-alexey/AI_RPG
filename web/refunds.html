<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Отмена и возвраты</title>
    <meta http-equiv="refresh" content="0; url=/?view=legal&tab=refunds&lang=ru" />
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const lang = params.get('lang') === 'en' ? 'en' : 'ru';
        const target = new URL('/', window.location.origin);
        target.searchParams.set('view', 'legal');
        target.searchParams.set('tab', 'refunds');
        target.searchParams.set('lang', lang);
        window.location.replace(target.toString());
      })();
    </script>
  </head>
  <body>
    <p><a href="/?view=legal&tab=refunds&lang=ru">Перейти в legal center</a></p>
  </body>
</html>
