<!DOCTYPE html>
<html>
<head>

  >

  <meta property="og:description" content="Нарративная ИИ-RPG, где история отвечает на каждый ваш выбор.">
  <meta property="og:image" content="/icons/Icon-512.png">
  <meta property="og:url" content="/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Стирая Грань">
  <meta name="twitter:description" content="Нарративная ИИ-RPG, где история отвечает на каждый ваш выбор.">
  <meta name="twitter:image" content="/icons/Icon-512.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0908">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Стирая Грань">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="canonical" href="/">
  <title>Стирая Грань</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1&display=swap" rel="stylesheet">

  <style>
    :root {
      --app-height: 100vh;
      --bg: #0a0908;
      --bg-top: #141210;
      --surface: rgba(16, 13, 11, 0.92);
      --surface-soft: rgba(26, 24, 22, 0.9);
      --surface-strong: rgba(12, 10, 9, 0.96);
      --border: rgba(200, 121, 65, 0.22);
      --border-soft: rgba(255, 255, 255, 0.06);
      --text: #e8e4e0;
      --muted: #837b74;
      --dim: #5b5550;
      --accent: #c87941;
      --accent-hover: #d4956a;
      --gold: #bfa76f;
      --danger: #ffb4ab;
      --radius-xl: 30px;
      --radius-lg: 22px;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      color-scheme: dark;
      font-family: "Inter", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    .material-symbols-outlined {
      font-family: "Material Symbols Outlined";
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: "liga";
      -webkit-font-smoothing: antialiased;
    }

    html,
    body {
      margin: 0;
      min-height: var(--app-height);
      background:
        radial-gradient(circle at 50% 22%, rgba(200, 121, 65, 0.17), transparent 40%),
        linear-gradient(180deg, var(--bg-top), var(--bg));
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.014) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.014) 1px, transparent 1px);
      background-size: 140px 140px;
      mask-image: radial-gradient(circle at center, black, transparent 82%);
      pointer-events: none;
      opacity: 0.38;
    }

    /* After Flutter canvas owns the viewport, drop decorative HTML layers that
       can flash through during compositor repaints (CanvasKit / desktop). */
    body.is-flutter-running {
      background: #0a0908;
      background-image: none;
    }

    body.is-flutter-running::before {
      display: none;
    }

    [hidden] {
      display: none !important;
    }

    #loading-container {
      position: relative;
      z-index: 1;
      min-height: var(--app-height);
      padding: 0 20px 48px;
      opacity: 1;
      transition: opacity 420ms ease, transform 420ms ease;
    }

    #loading-container.is-exiting {
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
    }

    .landing-shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 26px 0 40px;
    }

    .landing-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 6px 4px 22px;
    }

    .update-banner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      margin: 0 0 18px;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(191, 167, 111, 0.24);
      background: rgba(12, 10, 9, 0.92);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
    }

    .update-banner.is-force {
      border-color: rgba(255, 180, 171, 0.48);
    }

    .update-banner-copy {
      margin: 0;
      color: var(--text);
      line-height: 1.55;
      font-size: 14px;
    }

    .landing-tagline {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .language-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border-radius: 999px;
      border: 1px solid rgba(191, 167, 111, 0.2);
      background: rgba(12, 10, 9, 0.78);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.24);
    }

    .language-button {
      min-width: 72px;
      padding: 10px 16px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .language-button:hover {
      color: var(--text);
      transform: translateY(-1px);
    }

    .language-button.is-active {
      background: rgba(191, 167, 111, 0.14);
      color: #f1e7d6;
      box-shadow: inset 0 0 0 1px rgba(191, 167, 111, 0.32);
    }

    .language-button:disabled {
      cursor: default;
      opacity: 0.65;
      transform: none;
    }

    .hero-section {
      position: relative;
      display: grid;
      padding: 12px 0 56px;
    }

    .hero-frame {
      position: relative;
      min-height: 620px;
      padding: clamp(36px, 5vw, 64px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 30px;
      background: rgba(18, 15, 13, 0.94);
      box-shadow: var(--shadow);
    }

    .hero-copy {
      max-width: 720px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 52px;
      height: 1px;
      background: rgba(200, 121, 65, 0.48);
    }

    .brand-mark {
      margin: 18px 0 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(56px, 10vw, 110px);
      line-height: 0.9;
      font-weight: 500;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }

    .brand-subtitle {
      margin: 12px 0 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(22px, 3.4vw, 34px);
      line-height: 1.2;
      color: #efe6d9;
      font-style: italic;
    }

    .hero-description {
      margin: 20px 0 0;
      max-width: 560px;
      font-size: 16px;
      line-height: 1.8;
      color: var(--muted);
    }

    .hero-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
      margin-bottom: 30px;
    }

    .hero-pill {
      padding: 11px 15px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(10, 9, 8, 0.52);
      backdrop-filter: blur(8px);
      color: #d7cec7;
      font-size: 13px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .hero-launch-shell {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .section {
      position: relative;
      opacity: 0;
      transform: translateY(44px);
      transition: opacity 560ms ease, transform 560ms ease;
    }

    .section.is-visible,
    .section.is-hero {
      opacity: 1;
      transform: none;
    }

    .teaser-section,
    .tech-section {
      margin-top: 34px;
      padding: clamp(22px, 3vw, 34px);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(18, 15, 13, 0.98), rgba(10, 9, 8, 0.95));
      box-shadow: var(--shadow);
    }

    .teaser-chat {
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      gap: 22px;
    }

    #teaser-messages {
      display: grid;
      gap: 18px;
    }

    .teaser-bubble {
      padding: 20px 20px 20px 90px;
      border-radius: 22px;
      border: 1px solid rgba(191, 167, 111, 0.26);
      background: var(--surface-soft);
      position: relative;
      min-height: 104px;
      will-change: transform, opacity;
    }

    .teaser-bubble.is-player {
      padding: 20px 22px;
      margin-left: auto;
      max-width: 84%;
      border-color: rgba(200, 121, 65, 0.34);
      background: rgba(200, 121, 65, 0.12);
    }

    .teaser-bubble.is-system {
      padding: 18px 20px;
      min-height: auto;
      border-style: dashed;
      border-color: rgba(191, 167, 111, 0.24);
      background: rgba(191, 167, 111, 0.08);
    }

    .teaser-bubble.is-system .bubble-text::after {
      content: "";
      animation: storyDots 1.2s steps(3, end) infinite;
    }

    .teaser-avatar {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 54px;
      height: 54px;
      border-radius: 999px;
      overflow: hidden;
      border: 2px solid rgba(191, 167, 111, 0.44);
      background: #0c0a09;
      box-shadow: 0 0 0 4px rgba(191, 167, 111, 0.08);
    }

    .teaser-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
    }

    .bubble-author {
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
    }

    .bubble-author:empty {
      display: none;
    }

    .bubble-text {
      margin: 0;
      font-size: 16px;
      line-height: 1.65;
      color: var(--text);
      min-height: 26px;
    }

    .teaser-input-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      margin-top: 8px;
      padding: 10px;
      border-radius: 22px;
      border: 1px solid rgba(191, 167, 111, 0.18);
      background: rgba(13, 11, 10, 0.95);
    }

    .teaser-input {
      width: 100%;
      padding: 14px 14px 14px 16px;
      font-size: 16px;
      color: var(--text);
      min-height: 52px;
      display: flex;
      align-items: center;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.02);
      user-select: none;
    }

    .teaser-input.is-placeholder {
      color: var(--dim);
    }

    .teaser-send.is-pressed {
      transform: translateY(1px) scale(0.98);
      opacity: 0.88;
    }

    .typing-caret::after {
      content: "";
      display: inline-block;
      width: 1px;
      height: 1.05em;
      margin-left: 3px;
      background: currentColor;
      vertical-align: -0.12em;
      animation: caretBlink 1s step-end infinite;
    }

    .button-primary,
    .button-secondary {
      appearance: none;
      border-radius: 14px;
      padding: 16px 22px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, opacity 160ms ease, box-shadow 160ms ease;
    }

    .button-primary {
      border: 0;
      background: linear-gradient(180deg, #d4ba7e, var(--gold));
      color: #0c0a09;
      box-shadow: 0 0 36px rgba(191, 167, 111, 0.24);
    }

    .button-secondary {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(14, 12, 10, 0.9);
      color: var(--text);
    }

    .button-primary:hover,
    .button-secondary:hover {
      transform: translateY(-1px);
    }

    .button-primary:disabled,
    .button-secondary:disabled {
      opacity: 0.72;
      cursor: progress;
      transform: none;
    }

    .teaser-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .loading-shell {
      width: min(540px, 100%);
      display: none;
      gap: 14px;
      margin: 18px auto 0;
      padding: 18px 18px 16px;
      border-radius: 18px;
      border: 1px solid rgba(191, 167, 111, 0.26);
      background: rgba(14, 12, 10, 0.96);
    }

    .loading-shell.is-visible {
      display: grid;
    }

    .loading-shell.is-error {
      border-color: rgba(255, 180, 171, 0.6);
    }

    .loading-shell-top {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .loading-spinner {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 2px solid rgba(200, 121, 65, 0.2);
      border-top-color: var(--accent);
      animation: spin 900ms linear infinite;
      flex: 0 0 auto;
    }

    .loading-copy {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .loading-title,
    .loading-stage,
    .loading-flavor,
    .launch-note {
      margin: 0;
    }

    .loading-title {
      font-size: 16px;
      line-height: 1.35;
    }

    .loading-stage,
    .launch-note {
      font-size: 14px;
      line-height: 1.55;
      color: var(--muted);
    }

    .loading-progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(233, 226, 215, 0.08);
      overflow: hidden;
    }

    .loading-progress-fill {
      height: 100%;
      width: 12%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-hover), var(--accent));
      box-shadow: 0 0 18px rgba(200, 121, 65, 0.25);
      transition: width 500ms ease;
    }

    .loading-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }

    .loading-flavor {
      min-height: 22px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--gold);
      letter-spacing: 0.02em;
    }

    .launch-note {
      margin-top: 14px;
      min-height: 24px;
      text-align: center;
    }

    .launch-note.is-error {
      color: var(--danger);
    }

    .gallery-section {
      margin-top: 38px;
    }

    .section-title {
      margin: 0;
      text-align: center;
      font-family: "Playfair Display", serif;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1;
      text-transform: uppercase;
    }

    .world-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 28px;
    }

    .world-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid rgba(191, 167, 111, 0.18);
      background: rgba(14, 12, 10, 0.94);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 560ms ease, transform 560ms ease, box-shadow 220ms ease, border-color 220ms ease;
    }

    .world-card.is-visible {
      opacity: 1;
      transform: none;
    }

    .world-card:hover {
      border-color: rgba(191, 167, 111, 0.38);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.5);
    }

    .world-art {
      position: relative;
      aspect-ratio: 0.82;
      overflow: hidden;
    }

    .world-art img {
      width: calc(100% + 24px);
      height: calc(100% + 26px);
      object-fit: cover;
      object-position: center top;
      transform: translate(-12px, -22px) scale(1.08);
      transform-origin: center top;
      display: block;
    }

    .world-art::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 9, 8, 0.02), rgba(10, 9, 8, 0.82));
    }

    .world-body {
      padding: 18px;
      display: grid;
      grid-template-rows: minmax(72px, auto) minmax(104px, auto) auto;
      gap: 12px;
      flex: 1;
    }

    .world-title {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: 34px;
      line-height: 0.96;
      text-transform: uppercase;
    }

    .world-description {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }

    .world-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
    }

    .world-tag {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.05em;
    }

    .tech-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 22px;
    }

    .tech-card {
      padding: 22px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.025);
    }

    .tech-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
    }

    .tech-copy {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 15px;
    }

    .feedback-cta {
      margin-top: 34px;
      position: relative;
      display: block;
      min-height: 332px;
      padding: clamp(18px, 2.4vw, 36px);
      border-radius: var(--radius-xl);
      border: 1px solid rgba(191, 167, 111, 0.26);
      background: rgba(12, 10, 9, 0.94);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .feedback-cta::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(10, 9, 8, 0.94) 0%, rgba(10, 9, 8, 0.88) 24%, rgba(10, 9, 8, 0.58) 42%, rgba(10, 9, 8, 0.08) 62%, rgba(10, 9, 8, 0.12) 100%),
        linear-gradient(180deg, rgba(10, 9, 8, 0.22), rgba(10, 9, 8, 0.38)),
        url('landing/feedback_bg.png') 68% center / auto 100% no-repeat;
    }

    .feedback-cta::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 72% 52%, rgba(200, 121, 65, 0.2), transparent 28%),
        radial-gradient(circle at 82% 34%, rgba(255, 214, 145, 0.12), transparent 18%);
      pointer-events: none;
    }

    .feedback-cta-copy {
      position: relative;
      z-index: 1;
      max-width: min(44%, 560px);
      padding: 6px 0;
    }

    .feedback-cta-eyebrow,
    .feedback-kicker {
      margin: 0;
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .feedback-cta-title,
    .feedback-form-title {
      margin: 14px 0 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(40px, 5vw, 72px);
      line-height: 0.9;
      text-transform: uppercase;
      letter-spacing: -0.04em;
    }

    .feedback-cta-text,
    .feedback-form-copy,
    .feedback-page-subtitle,
    .feedback-contact-copy,
    .feedback-aside-item {
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.72;
      font-size: 17px;
    }

    .feedback-cta-actions {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .feedback-cta-art {
      display: none;
    }

    .feedback-view {
      padding: 12px 0 18px;
    }

    .feedback-page-hero {
      margin-top: 10px;
    }

    .feedback-hero-card,
    .feedback-form-panel,
    .feedback-aside,
    .feedback-contacts-panel {
      border-radius: var(--radius-xl);
      border: 1px solid rgba(191, 167, 111, 0.22);
      background:
        radial-gradient(circle at top left, rgba(191, 167, 111, 0.08), transparent 42%),
        linear-gradient(180deg, rgba(18, 15, 13, 0.98), rgba(10, 9, 8, 0.95));
      box-shadow: var(--shadow);
    }

    .feedback-hero-card {
      padding: clamp(28px, 4vw, 42px);
    }

    .feedback-back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #f0d9b7;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 0.04em;
      transition: color 180ms ease, transform 180ms ease;
    }

    .feedback-back-link:hover {
      color: #fff2dc;
      transform: translateX(-2px);
    }

    .feedback-page-title {
      margin: 18px 0 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(42px, 6vw, 74px);
      line-height: 0.94;
      text-transform: uppercase;
    }

    .feedback-layout {
      margin-top: 28px;
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      gap: 18px;
      align-items: start;
    }

    .feedback-form-panel,
    .feedback-aside,
    .feedback-contacts-panel {
      padding: clamp(24px, 3vw, 32px);
    }

    .feedback-form {
      display: grid;
      gap: 18px;
      margin-top: 24px;
    }

    .feedback-topic-group {
      display: grid;
      gap: 12px;
    }

    .feedback-label,
    .feedback-aside-title {
      margin: 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .feedback-topic-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .feedback-topic-option {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .feedback-topic-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .feedback-topic-option span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      transition: border-color 180ms ease, background 180ms ease, color 180ms ease, transform 180ms ease;
      cursor: pointer;
    }

    .feedback-topic-option input:checked + span {
      border-color: rgba(191, 167, 111, 0.38);
      background: rgba(191, 167, 111, 0.12);
      color: #f3eadb;
      box-shadow: inset 0 0 0 1px rgba(191, 167, 111, 0.26);
    }

    .feedback-topic-option span:hover {
      transform: translateY(-1px);
    }

    .feedback-field {
      display: grid;
      gap: 10px;
    }

    .feedback-input,
    .feedback-textarea {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      background: rgba(13, 11, 10, 0.94);
      color: var(--text);
      font: inherit;
      padding: 16px 18px;
      transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    .feedback-input::placeholder,
    .feedback-textarea::placeholder {
      color: var(--dim);
    }

    .feedback-input:focus,
    .feedback-textarea:focus {
      outline: none;
      border-color: rgba(191, 167, 111, 0.4);
      box-shadow: 0 0 0 4px rgba(191, 167, 111, 0.1);
      transform: translateY(-1px);
    }

    .feedback-textarea {
      min-height: 180px;
      resize: vertical;
    }

    .feedback-file-input {
      width: 100%;
      border: 1px dashed rgba(191, 167, 111, 0.28);
      border-radius: 18px;
      background: rgba(13, 11, 10, 0.94);
      color: var(--muted);
      font: inherit;
      padding: 14px 16px;
      cursor: pointer;
    }

    .feedback-file-hint {
      color: var(--dim);
      font-size: 13px;
      line-height: 1.5;
    }

    .feedback-files-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 16px;
    }

    .feedback-file-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      font-size: 13px;
      line-height: 1.4;
    }

    .feedback-form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .feedback-status {
      margin: 2px 0 0;
      min-height: 24px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--muted);
    }

    .feedback-status.is-error {
      color: var(--danger);
    }

    .feedback-aside-list {
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 14px;
      counter-reset: feedback-item;
    }

    .feedback-aside-item {
      margin: 0;
      padding: 14px 16px 14px 52px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.02);
      position: relative;
      font-size: 15px;
    }

    .feedback-aside-item::before {
      content: "0" counter(feedback-item);
      counter-increment: feedback-item;
      position: absolute;
      top: 14px;
      left: 16px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    .feedback-contacts-panel {
      margin-top: 18px;
      display: grid;
      gap: 18px;
    }

    .feedback-contact-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .feedback-contact-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.025);
      color: var(--text);
      text-decoration: none;
      transition: transform 180ms ease, border-color 180ms ease, color 180ms ease;
    }

    .feedback-contact-card:hover {
      transform: translateY(-1px);
      border-color: rgba(191, 167, 111, 0.34);
      color: #f0d9b7;
    }

    .feedback-contact-card .footer-contact-icon {
      width: 22px;
      height: 22px;
    }

    .legal-view {
      padding: 12px 0 24px;
    }

    .legal-page-hero {
      margin-top: 10px;
    }

    .legal-hero-card,
    .legal-sidebar,
    .legal-document-shell,
    .legal-contact-panel {
      border-radius: var(--radius-xl);
      border: 1px solid rgba(191, 167, 111, 0.22);
      background:
        radial-gradient(circle at top left, rgba(191, 167, 111, 0.08), transparent 42%),
        linear-gradient(180deg, rgba(18, 15, 13, 0.98), rgba(10, 9, 8, 0.95));
      box-shadow: var(--shadow);
    }

    .legal-hero-card {
      padding: clamp(28px, 4vw, 42px);
    }

    .legal-layout {
      margin-top: 28px;
      display: grid;
      grid-template-columns: minmax(248px, 0.34fr) minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .legal-sidebar {
      position: sticky;
      top: 18px;
      padding: 24px 20px;
      display: grid;
      gap: 18px;
    }

    .legal-nav-title {
      margin: 0;
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .legal-nav-list,
    .legal-mobile-nav-list {
      display: grid;
      gap: 10px;
    }

    .legal-nav-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.025);
      color: var(--muted);
      text-align: left;
      cursor: pointer;
      transition: border-color 180ms ease, background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .legal-nav-button:hover {
      transform: translateY(-1px);
      color: var(--text);
      border-color: rgba(191, 167, 111, 0.2);
    }

    .legal-nav-button.is-active {
      border-color: rgba(191, 167, 111, 0.38);
      background: rgba(191, 167, 111, 0.12);
      color: #f3eadb;
      box-shadow: inset 0 0 0 1px rgba(191, 167, 111, 0.24);
    }

    .legal-nav-icon {
      width: 22px;
      height: 22px;
      color: var(--accent);
      flex: 0 0 auto;
      font-variation-settings: 'FILL' 1, 'wght' 350, 'GRAD' 0, 'opsz' 24;
    }

    .legal-nav-copy {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .legal-nav-label {
      color: inherit;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .legal-nav-hint {
      color: var(--dim);
      font-size: 12px;
      line-height: 1.45;
      text-transform: none;
      letter-spacing: 0;
    }

    .legal-main {
      min-width: 0;
      display: grid;
      gap: 18px;
    }

    .legal-mobile-tabs {
      display: none;
      position: sticky;
      top: 10px;
      z-index: 4;
    }

    .legal-mobile-nav-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      padding: 12px;
      border-radius: 22px;
      border: 1px solid rgba(191, 167, 111, 0.22);
      background: rgba(10, 9, 8, 0.94);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .legal-document-shell,
    .legal-contact-panel {
      padding: clamp(24px, 3vw, 32px);
    }

    .legal-document-title {
      margin: 16px 0 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(34px, 4vw, 58px);
      line-height: 0.98;
      text-transform: uppercase;
      letter-spacing: -0.04em;
    }

    .legal-document-copy {
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.72;
      font-size: 17px;
      max-width: 860px;
    }

    .legal-summary-grid {
      margin-top: 26px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .legal-summary-card {
      padding: 18px 18px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.025);
    }

    .legal-summary-card.is-accent {
      border-color: rgba(191, 167, 111, 0.2);
      background: linear-gradient(180deg, rgba(191, 167, 111, 0.12), rgba(255, 255, 255, 0.025));
    }

    .legal-summary-eyebrow {
      margin: 0;
      color: var(--gold);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .legal-summary-title {
      margin: 12px 0 0;
      color: var(--text);
      font-size: 18px;
      line-height: 1.3;
    }

    .legal-summary-copy {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .legal-article {
      margin-top: 28px;
      display: grid;
      gap: 18px;
    }

    .legal-section {
      padding: 22px 22px 24px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.02);
    }

    .legal-section-title {
      margin: 0;
      color: var(--text);
      font-family: "Playfair Display", serif;
      font-size: clamp(24px, 2.4vw, 32px);
      line-height: 1.1;
    }

    .legal-section p,
    .legal-section li {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.72;
    }

    .legal-section p {
      margin: 14px 0 0;
    }

    .legal-section ul {
      margin: 14px 0 0;
      padding-left: 20px;
      display: grid;
      gap: 10px;
    }

    .legal-section-callout {
      margin-top: 16px;
      padding: 16px 18px;
      border-left: 3px solid rgba(191, 167, 111, 0.42);
      border-radius: 0 16px 16px 0;
      background: rgba(191, 167, 111, 0.08);
      color: #f2e6d2;
      font-size: 14px;
      line-height: 1.6;
    }

    .legal-inline-link {
      color: #f0d9b7;
      text-decoration: none;
      border-bottom: 1px solid rgba(240, 217, 183, 0.22);
      transition: color 180ms ease, border-color 180ms ease;
    }

    .legal-inline-link:hover {
      color: #fff2dc;
      border-color: rgba(255, 242, 220, 0.42);
    }

    .legal-contact-panel {
      display: grid;
      gap: 18px;
    }

    .legal-contact-copy {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      max-width: 720px;
    }

    .landing-footer {
      margin-top: 36px;
      padding: 22px 8px 10px;
      border-top: 1px solid rgba(191, 167, 111, 0.16);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: start;
    }

    .footer-legal-nav {
      grid-column: 1 / -1;
      display: inline-flex;
      flex-wrap: wrap;
      gap: 18px 28px;
      justify-content: center;
      justify-self: center;
      align-self: center;
      width: min(100%, 760px);
      padding: 16px 24px;
      border-radius: 999px;
      border: 1px solid rgba(191, 167, 111, 0.18);
      background:
        radial-gradient(circle at top center, rgba(191, 167, 111, 0.08), transparent 60%),
        rgba(255, 255, 255, 0.02);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(14px);
    }

    .footer-legal-link {
      color: #f0d9b7;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: color 180ms ease, transform 180ms ease;
    }

    .footer-legal-link:hover {
      color: #fff2dc;
      transform: translateY(-1px);
    }

    .footer-brand {
      min-width: 0;
    }

    .footer-brand-name {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(26px, 4vw, 38px);
      line-height: 0.95;
      color: var(--text);
    }

    .footer-brand-copy {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .footer-contacts {
      display: grid;
      gap: 12px;
      justify-items: start;
    }

    .footer-contacts-title {
      margin: 0;
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .footer-contact-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
      transition: color 180ms ease, transform 180ms ease;
    }

    .footer-contact-link:hover {
      color: #f0d9b7;
      transform: translateY(-1px);
    }

    .footer-contact-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: var(--accent);
    }

    .footer-contact-meta {
      display: grid;
      gap: 2px;
    }

    .footer-contact-label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .footer-contact-value {
      color: inherit;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes caretBlink {
      50% { opacity: 0; }
    }

    @keyframes storyDots {
      0% { content: ""; }
      33% { content: "."; }
      66% { content: ".."; }
      100% { content: "..."; }
    }

    @media (max-width: 980px) {
      .world-grid,
      .tech-grid {
        grid-template-columns: 1fr;
        display: grid;
      }

      .feedback-layout,
      .feedback-contact-grid {
        grid-template-columns: 1fr;
      }

      .legal-layout,
      .legal-summary-grid {
        grid-template-columns: 1fr;
      }

      .legal-sidebar {
        display: none;
      }

      .legal-mobile-tabs {
        display: block;
      }

      .feedback-cta {
        min-height: 320px;
      }

      .feedback-cta-copy {
        max-width: min(56%, 460px);
      }

      .landing-footer {
        grid-template-columns: 1fr;
      }

      .footer-legal-nav {
        width: 100%;
      }
    }

    @media (max-width: 760px) {
      #loading-container {
        padding: 0 14px 34px;
      }

      .landing-shell {
        padding-top: 18px;
      }

      .hero-section {
        min-height: auto;
        padding: 10px 0 28px;
      }

      .teaser-input-shell {
        grid-template-columns: 1fr;
      }

      .teaser-bubble.is-player {
        max-width: 100%;
      }
    }

    @media (max-width: 560px) {
      .landing-topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .language-toggle {
        width: 100%;
      }

      .language-button {
        flex: 1;
      }

      .hero-frame,
      .teaser-section,
      .tech-section,
      .feedback-cta,
      .feedback-hero-card,
      .feedback-form-panel,
      .feedback-aside,
      .feedback-contacts-panel,
      .legal-hero-card,
      .legal-document-shell,
      .legal-contact-panel,
      .legal-mobile-nav-list {
        border-radius: 24px;
      }

      .hero-actions,
      .hero-launch-shell,
      .teaser-actions,
      .feedback-cta-actions,
      .feedback-form-actions {
        width: 100%;
      }

      .button-primary,
      .button-secondary {
        width: 100%;
      }

      .feedback-cta {
        min-height: 300px;
        padding: 18px 18px 20px;
      }

      .feedback-cta::before {
        background:
          linear-gradient(180deg, rgba(10, 9, 8, 0.9) 0%, rgba(10, 9, 8, 0.78) 34%, rgba(10, 9, 8, 0.34) 68%, rgba(10, 9, 8, 0.16) 100%),
          linear-gradient(180deg, rgba(10, 9, 8, 0.18), rgba(10, 9, 8, 0.44)),
          url('landing/feedback_bg.png') 70% center / auto 100% no-repeat;
      }

      .feedback-cta-copy {
        max-width: 100%;
      }

      .legal-mobile-nav-list {
        grid-template-columns: 1fr;
      }

      .footer-legal-nav {
        padding: 16px 18px;
        gap: 12px 20px;
        border-radius: 26px;
      }

      .feedback-topic-options {
        display: grid;
      }

      .world-title {
        font-size: 28px;
      }

      .loading-meta {
        flex-direction: column;
        align-items: flex-start;
      }

      .footer-contact-link {
        width: 100%;
      }
    }

    /* OAuth return: only loading UI, no marketing landing chrome */
    body.is-oauth-callback .landing-topbar {
      display: none !important;
    }

    body.is-oauth-callback #landing-view > section:not(.is-hero) {
      display: none !important;
    }

    body.is-oauth-callback #landing-view .is-hero .hero-frame {
      min-height: min(100vh, 760px);
      padding-top: 10vh;
    }

    body.is-oauth-callback #landing-view .is-hero .hero-copy > *:not(#loading-shell):not(#loading-note) {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <main class="landing-shell">
      <header class="landing-topbar">
        <div id="landing-tagline" class="landing-tagline"></div>
        <div class="language-toggle" aria-label="Language switcher">
          <button id="language-ru" class="language-button" type="button" data-language-button="ru">РУС</button>
          <button id="language-en" class="language-button" type="button" data-language-button="en">ENG</button>
        </div>
      </header>

      <section id="update-banner" class="update-banner" hidden>
        <p id="update-banner-text" class="update-banner-copy"></p>
        <button id="update-reload-button" class="button-secondary" type="button">Reload</button>
      </section>

      <div id="landing-view">
        <section class="hero-section section is-hero">
          <div id="hero-frame" class="hero-frame">
            <div class="hero-copy">
              <div id="landing-eyebrow" class="eyebrow"></div>
              <h1 id="landing-brand" class="brand-mark"></h1>
              <p id="landing-title" class="brand-subtitle"></p>
              <p id="landing-subtitle" class="hero-description"></p>
              <div id="landing-pills" class="hero-pills"></div>
              <div class="hero-actions">
                <div id="hero-launch-shell" class="hero-launch-shell">
                  <button id="launch-button" class="button-primary" type="button"></button>
                  <button id="how-button" class="button-secondary" type="button"></button>
                </div>
              </div>
              <section id="loading-shell" class="loading-shell" aria-live="polite" hidden>
                <div class="loading-shell-top">
                  <div class="loading-spinner" aria-hidden="true"></div>
                  <div class="loading-copy">
                    <p id="loading-title" class="loading-title"></p>
                    <p id="loading-stage" class="loading-stage"></p>
                  </div>
                </div>
                <div class="loading-progress-track" aria-hidden="true">
                  <div id="loading-progress-fill" class="loading-progress-fill"></div>
                </div>
                <div class="loading-meta">
                  <span id="loading-progress-label"></span>
                  <span id="loading-eta"></span>
                </div>
                <p id="loading-flavor" class="loading-flavor"></p>
              </section>
              <p id="loading-note" class="launch-note" aria-live="polite"></p>
            </div>
          </div>
        </section>

        <section class="teaser-section section" data-reveal>
          <div class="teaser-chat">
            <div id="teaser-messages"></div>

            <div class="teaser-input-shell">
              <div id="teaser-input" class="teaser-input is-placeholder"></div>
              <button id="teaser-send" class="button-primary teaser-send" type="button"></button>
            </div>
          </div>
        </section>

        <section class="gallery-section section" data-reveal>
          <h2 id="gallery-title" class="section-title"></h2>
          <div id="world-grid" class="world-grid"></div>
        </section>

        <section id="how-anchor" class="tech-section section" data-reveal>
          <h2 id="tech-title" class="section-title"></h2>
          <div id="tech-grid" class="tech-grid"></div>
        </section>

        <section class="feedback-cta section" data-reveal>
          <div class="feedback-cta-copy">
            <p id="feedback-cta-eyebrow" class="feedback-cta-eyebrow"></p>
            <h2 id="feedback-cta-title" class="feedback-cta-title"></h2>
            <p id="feedback-cta-text" class="feedback-cta-text"></p>
            <div class="feedback-cta-actions">
              <button id="feedback-cta-button" class="button-primary" type="button"></button>

        window.location.replace(callbackUrl.toString());
      }

      function encodeSharedPreferencesString(value) {
        return JSON.stringify(value);
      }

      function persistSymmetrySession(sessionPayload) {
        const sessionValue = encodeSharedPreferencesString(
          JSON.stringify(sessionPayload)
        );
        const baseUrlValue = encodeSharedPreferencesString('/v1');

        // Flutter SharedPreferences on web stores keys with the "flutter." prefix.
        window.localStorage.setItem('flutter.settings.symmetry_session', sessionValue);
        window.localStorage.setItem('flutter.settings.symmetry_base_url', baseUrlValue);

        // Keep unprefixed compatibility keys during rollout; Flutter ignores them.
        window.localStorage.setItem('settings.symmetry_session', sessionValue);
        window.localStorage.setItem('settings.symmetry_base_url', baseUrlValue);
      }

      function buildAutostartUrl(options) {
        const nextUrl = new URL('/', window.location.origin);
        nextUrl.searchParams.set('autostart', '1');
        if (currentLanguage) {
          nextUrl.searchParams.set('lang', currentLanguage);
        }
        if (options && options.oauthError) {
          nextUrl.searchParams.set('oauth_error', options.oauthError);
        }
        return nextUrl.toString();
      }

      async function completeYandexHandoffFromLanding() {
        showLoadingShell();
        setInteractiveState(true);
        setStage(0);
        setLoadingNote('Завершаем вход...', false);

        try {
          const response = await fetch('/v1/auth/yandex/complete', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              handoff_id: yandexHandoffId
            })
          });
          let payload = null;
          try {
            payload = await response.json();
          } catch (_) {}

          if (!response.ok || !payload || !payload.user || !payload.tokens) {
            const detailCode = payload && payload.detail ? String(payload.detail) : 'provider_auth_failed';
            window.location.replace(buildAutostartUrl({ oauthError: detailCode }));
            return;
          }

          persistSymmetrySession({
            user: payload.user,
            tokens: payload.tokens,
            base_url: '/v1'
          });
          window.location.replace(buildAutostartUrl());
        } catch (_) {
          window.location.replace(buildAutostartUrl({ oauthError: 'provider_auth_failed' }));
        }
      }

      function syncLanguageUrl(mode) {

          nextParams.delete('tab');
        } else if (currentView === 'legal') {
          nextParams.set('view', 'legal');
          nextParams.set('tab', currentLegalTab);
        } else {
          nextParams.delete('view');

        }
        const nextQuery = nextParams.toString();
        const nextUrl = `${window.location.pathname}${nextQuery ? `?${nextQuery}` : ''}${window.location.hash}`;
        const method = mode === 'push' ? 'pushState' : 'replaceState';
        window.history[method](
          { view: currentView, lang: currentLanguage, tab: currentLegalTab },
          '',
          nextUrl
        );
      }

      function updateTeaserBubbleNode(bubble, message) {
        bubble.className = `teaser-bubble${message.role === 'player' ? ' is-player' : ''}${message.role === 'system' ? ' is-system' : ''}`;
        bubble.dataset.messageId = message.id;

            bubble.appendChild(avatar);

        } else if (avatar) {

        let author = bubble.querySelector('.bubble-author');
        if (!author) {
          author = document.createElement('p');
          author.className = 'bubble-author';
          bubble.appendChild(author);
        }
        author.textContent = message.role === 'narrator'
          ? text.teaserNarrator
          : (message.role === 'player' ? text.playerLabel : '');

        let content = bubble.querySelector('.bubble-text');
        if (!content) {
          content = document.createElement('p');
          content.className = 'bubble-text';
          bubble.appendChild(content);
        }
        content.textContent = message.text;
        content.classList.toggle('typing-caret', Boolean(message.typing));
      }

      function animateTeaserEntry(node, role) {
        const keyframes = role === 'player'
          ? [
              { opacity: 0, transform: 'translate3d(0, 28px, 0) scale(0.985)', filter: 'blur(10px)' },
              { opacity: 1, transform: 'translate3d(0, 0, 0) scale(1)', filter: 'blur(0)' }
            ]
          : [
              { opacity: 0, transform: 'translate3d(0, 22px, 0) scale(0.99)', filter: 'blur(12px)' },
              { opacity: 1, transform: 'translate3d(0, 0, 0) scale(1)', filter: 'blur(0)' }
            ];

        node.animate(keyframes, {
          duration: 560,
          easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
          fill: 'both'
        });
      }

      function renderTeaserMessages() {
        const previousPositions = new Map();
        const existingNodes = new Map();

        Array.from(teaserMessagesHost.children).forEach((node) => {
          previousPositions.set(node.dataset.messageId, node.getBoundingClientRect());
          existingNodes.set(node.dataset.messageId, node);
        });

        const nextNodes = teaserMessages.map((message) => {
          const bubble = existingNodes.get(message.id) || document.createElement('article');
          updateTeaserBubbleNode(bubble, message);
          return bubble;
        });

        Array.from(existingNodes.entries()).forEach(([messageId, node]) => {
          if (!teaserMessages.some((message) => message.id === messageId)) {
            node.remove();
          }
        });

        nextNodes.forEach((node) => {
          teaserMessagesHost.appendChild(node);
        });

        window.requestAnimationFrame(() => {
          nextNodes.forEach((node) => {
            const messageId = node.dataset.messageId;
            const previousRect = previousPositions.get(messageId);
            const nextRect = node.getBoundingClientRect();

            if (!previousRect) {
              const message = teaserMessages.find((item) => item.id === messageId);
              animateTeaserEntry(node, message ? message.role : 'narrator');
              return;
            }

            const deltaX = previousRect.left - nextRect.left;
            const deltaY = previousRect.top - nextRect.top;

            if (Math.abs(deltaX) > 0.5 || Math.abs(deltaY) > 0.5) {
              node.animate(
                [
                  { transform: `translate3d(${deltaX}px, ${deltaY}px, 0)` },
                  { transform: 'translate3d(0, 0, 0)' }
                ],
                {
                  duration: 520,
                  easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
                }
              );
            }
          });
        });
      }

      function refreshViewportMetrics() {
        window.scrollTo(0, 0);
        syncViewportHeight();
        window.dispatchEvent(new Event('resize'));
      }

      async function loadLocalVersionInfo() {
        try {
          const response = await fetch('version.json', {
            cache: 'no-store'
          });
          if (!response.ok) {
            return {
              app_version: '',
              asset_version: ''
            };
          }
          const data = await response.json();
          return {
            app_version: data.app_version || '',
            asset_version: data.asset_version || ''
          };
        } catch (_) {
          return {
            app_version: '',
            asset_version: ''
          };
        }
      }

      function ensureLocalVersionInfoLoaded(options) {
        const forceRefresh = Boolean(options && options.forceRefresh);
        if (!forceRefresh && localVersionInfoPromise) {
          return localVersionInfoPromise;
        }

        localVersionInfoPromise = loadLocalVersionInfo()
          .then((info) => {
            localVersionInfo = info;
            return info;
          })
          .catch(() => {
            localVersionInfo = {
              app_version: '',
              asset_version: ''
            };
            return localVersionInfo;
          });

        return localVersionInfoPromise;
      }

      function applyFlutterEntrypointVersion(assetVersion) {
        if (!window._flutter || !window._flutter.buildConfig || !Array.isArray(window._flutter.buildConfig.builds)) {
          return;
        }

        window._flutter.buildConfig.builds.forEach((build) => {
          if (!build || typeof build.mainJsPath !== 'string' || !build.mainJsPath.trim()) {
            return;
          }

          const cleanPath = build.mainJsPath.split('?')[0];
          build.mainJsPath = assetVersion
            ? `${cleanPath}?v=${encodeURIComponent(assetVersion)}`
            : cleanPath;
        });
      }

      async function fetchRemoteVersionInfo() {
        try {
          const params = new URLSearchParams();
          if (localVersionInfo.app_version) {
            params.set('current_version', localVersionInfo.app_version);
          }
          if (localVersionInfo.asset_version) {
            params.set('current_asset_version', localVersionInfo.asset_version);
          }
          const url = params.toString() ? `/version?${params.toString()}` : '/version';
          const response = await fetch(url, {
            cache: 'no-store'
          });
          if (!response.ok) {
            return null;
          }
          return await response.json();
        } catch (_) {
          return null;
        }
      }

      function showUpdateBanner(message, options) {
        if (!updateBanner || !updateBannerText) {
          return;
        }
        const force = Boolean(options && options.force);
        updateBannerLocked = force;
        updateBanner.hidden = false;
        updateBanner.classList.toggle('is-force', force);
        updateBannerText.textContent = message;
        setInteractiveState(force);
      }

      function hideUpdateBanner() {
        if (!updateBanner || updateBannerLocked) {
          return;
        }
        updateBanner.hidden = true;
        updateBanner.classList.remove('is-force');
        updateBannerText.textContent = '';
      }

      async function requestServiceWorkerRefresh() {
        if (!('serviceWorker' in navigator)) {
          return;
        }

        const registration = await navigator.serviceWorker.getRegistration();
        if (!registration) {
          return;
        }

        let waitingWorker = registration.waiting;
        await registration.update();
        waitingWorker = registration.waiting || waitingWorker;

        if (waitingWorker) {
          waitingWorker.postMessage('skipWaiting');
        }
      }

      async function clearBrowserUpdateState() {
        if ('caches' in window) {
          try {
            const cacheKeys = await caches.keys();
            await Promise.all(cacheKeys.map((cacheKey) => caches.delete(cacheKey)));
          } catch (_) {}
        }

        if ('serviceWorker' in navigator) {
          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          } catch (_) {}
        }
      }

      async function reloadForUpdate() {
        setInteractiveState(true);
        await requestServiceWorkerRefresh();
        await clearBrowserUpdateState();
        const latestLocalVersionInfo = await ensureLocalVersionInfoLoaded({ forceRefresh: true });
        applyFlutterEntrypointVersion(latestLocalVersionInfo.asset_version);
        const url = new URL(window.location.href);
        url.searchParams.set('v', Date.now().toString());
        window.location.replace(url.toString());
      }

      async function runStartupVersionCheck() {
        localVersionInfo = await ensureLocalVersionInfoLoaded();
        applyFlutterEntrypointVersion(localVersionInfo.asset_version);
        const remoteVersionInfo = await fetchRemoteVersionInfo();
        const webInfo = remoteVersionInfo && remoteVersionInfo.platforms
          ? remoteVersionInfo.platforms.web
          : null;

        if (!webInfo) {
          hideUpdateBanner();
          return;
        }

        const reloadRequired = Boolean(webInfo.reload_required);
        const forceUpdate = webInfo.update_mode === 'force' || reloadRequired;
        const softUpdate = webInfo.update_mode === 'soft';

        if (!forceUpdate && !softUpdate) {
          updateBannerLocked = false;
          setInteractiveState(false);
          hideUpdateBanner();
          return;
        }

        const fallbackMessage = forceUpdate
          ? 'A new web build is ready. Reload to continue.'
          : 'A newer version is available. Reload when convenient.';
        showUpdateBanner(webInfo.message || fallbackMessage, {
          force: forceUpdate
        });
      }

      function clearLaunchTimers() {
        if (flavorTimer !== null) {
          window.clearInterval(flavorTimer);
          flavorTimer = null;
        }
        if (slowLoadTimer !== null) {
          window.clearTimeout(slowLoadTimer);
          slowLoadTimer = null;
        }
      }

      function setInteractiveState(disabled) {
        launchButton.disabled = disabled;
        howButton.disabled = disabled;
        teaserSend.disabled = disabled;
        feedbackCtaButton.disabled = disabled;
        feedbackBackButton.disabled = disabled;
        feedbackForm.querySelectorAll('input, textarea, button').forEach((field) => {
          field.disabled = disabled;
        });
        languageButtons.forEach((button) => {
          button.disabled = disabled;
        });
      }

      function showLoadingShell() {
        heroLaunchShell.hidden = true;
        loadingShell.hidden = false;
        loadingShell.classList.add('is-visible');
      }

      function showLaunchButtons() {
        heroLaunchShell.hidden = false;
        loadingShell.hidden = true;
        loadingShell.classList.remove('is-visible');
        loadingShell.classList.remove('is-error');
      }

      function setStage(stageIndex, options) {
        currentStageIndex = Math.max(0, Math.min(stageIndex, text.loadingStages.length - 1));
        const progress = stageProgress[Math.min(currentStageIndex, stageProgress.length - 1)];
        loadingTitle.textContent = text.loadingTitle;
        loadingStage.textContent = text.loadingStages[currentStageIndex];
        loadingEta.textContent = options && options.longEta ? text.loadingEtaLong : text.loadingEtaShort;
        loadingProgressFill.style.width = `${Math.round(progress * 100)}%`;
        loadingProgressLabel.textContent = `${Math.round(progress * 100)}%`;
      }

      function startFlavorRotation() {
        currentFlavorIndex = 0;
        loadingFlavor.textContent = text.loadingFlavorLines[currentFlavorIndex];
        flavorTimer = window.setInterval(() => {
          currentFlavorIndex = (currentFlavorIndex + 1) % text.loadingFlavorLines.length;
          loadingFlavor.textContent = text.loadingFlavorLines[currentFlavorIndex];
        }, 2200);
      }

      function enterLaunchState() {
        launchStartedAt = Date.now();
        showLoadingShell();
        setInteractiveState(true);
        loadingShell.classList.remove('is-error');
        setLoadingNote('', false);
        setStage(0);
        startFlavorRotation();
        slowLoadTimer = window.setTimeout(() => {
          if (!launchInFlight || launchCompleted) {
            return;
          }
          loadingEta.textContent = text.loadingEtaLong;
          setLoadingNote(text.loadingSlow, false);
        }, 8000);
      }

      function resetLaunchState(message) {
        clearLaunchTimers();
        launchInFlight = false;
        launchCompleted = false;
        setInteractiveState(false);
        showLaunchButtons();
        if (message) {
          setLoadingNote(message, true);
        }
      }

      function markFlutterRunning() {
        document.body.classList.add('is-flutter-running');
      }

      function finishLaunchTransition() {
        markFlutterRunning();
        if (launchCompleted) {
          return;
        }
        launchCompleted = true;
        clearLaunchTimers();
        setStage(text.loadingStages.length - 1, { longEta: true });
        loadingFlavor.textContent = text.loadingFlavorLines[currentFlavorIndex % text.loadingFlavorLines.length];
        setLoadingNote('', false);
        const elapsed = Date.now() - launchStartedAt;
        const remaining = Math.max(0, 650 - elapsed);
        window.setTimeout(() => {
          loadingContainer.classList.add('is-exiting');
          window.setTimeout(() => {
            loadingContainer.remove();
          }, 460);
        }, remaining);
      }

      async function launchFlutter() {
        if (launchInFlight) {
          return;
        }

        launchInFlight = true;
        enterLaunchState();

        try {
          const resolvedLocalVersionInfo = await ensureLocalVersionInfoLoaded();
          applyFlutterEntrypointVersion(resolvedLocalVersionInfo.asset_version);
          const start = window.__codexLaunchFlutterApp || (window._flutter && window._flutter.loader
            ? function () {
                return window._flutter.loader.load({
                  onEntrypointLoaded: async function (engineInitializer) {
                    if (launchInFlight && !launchCompleted) {
                      setStage(1);
                    }
                    const appRunner = await engineInitializer.initializeEngine();
                    if (launchInFlight && !launchCompleted) {
                      setStage(2);
                    }
                    const runResult = await appRunner.runApp();
                    if (launchInFlight && !launchCompleted) {
                      setStage(3, { longEta: true });
                    }
                    return runResult;
                  }
                });
              }
            : null);

          if (!start) {
            throw new Error('Flutter loader is unavailable');
          }

          await start();
        } catch (error) {
          console.error('Flutter web bootstrap failed', error);
          resetLaunchState(text.loadingRetry);
        }
      }

      function typeText(target, textValue, speed, runToken) {
        return new Promise((resolve) => {
          let index = 0;
          target.textContent = '';
          target.classList.add('typing-caret');
          const timer = window.setInterval(() => {
            if (runToken !== teaserSequenceToken) {
              window.clearInterval(timer);
              target.classList.remove('typing-caret');
              resolve(false);
              return;
            }
            index += 1;
            target.textContent = textValue.slice(0, index);
            if (index >= textValue.length) {
              window.clearInterval(timer);
              target.classList.remove('typing-caret');
              resolve(true);
            }
          }, speed);
        });
      }

      function wait(ms, runToken) {
        return new Promise((resolve) => {
          window.setTimeout(() => {
            resolve(runToken === teaserSequenceToken);
          }, ms);
        });
      }

      async function startTeaserSequence() {
        if (teaserSequenceStarted) {
          return;
        }
        teaserSequenceStarted = true;
        const runToken = ++teaserSequenceToken;

        const narratorMessage = teaserMessages[0];
        narratorMessage.typing = true;
        renderTeaserMessages();
        const narratorTextNode = teaserMessagesHost.querySelector('.teaser-bubble .bubble-text');
        if (!narratorTextNode) {
          teaserSequenceStarted = false;
          return;
        }
        if (!(await typeText(narratorTextNode, text.teaserPrompt, 28, runToken))) {
          return;
        }
        if (runToken !== teaserSequenceToken) {
          return;
        }
        narratorMessage.text = text.teaserPrompt;
        narratorMessage.typing = false;
        renderTeaserMessages();

        if (!(await wait(280, runToken))) {
          return;
        }
        teaserInput.classList.remove('is-placeholder');
        if (!(await typeText(teaserInput, text.teaserPreviewInput, 36, runToken))) {
          return;
        }

        if (!(await wait(260, runToken))) {
          return;
        }
        teaserSend.classList.add('is-pressed');
        if (!(await wait(160, runToken))) {
          teaserSend.classList.remove('is-pressed');
          return;
        }
        teaserSend.classList.remove('is-pressed');

        teaserMessages.push(createTeaserMessage('player', text.teaserPreviewInput));
        teaserInput.textContent = text.teaserPlaceholder;
        teaserInput.classList.add('is-placeholder');
        renderTeaserMessages();

        if (!(await wait(240, runToken))) {
          return;
        }
        teaserMessages.push(
          createTeaserMessage('system', text.teaserGenerating, { typing: true })
        );
        renderTeaserMessages();
      }

      function wireRevealEffects() {
        const revealNodes = Array.from(document.querySelectorAll('[data-reveal]'));
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) {
              return;
            }
            entry.target.classList.add('is-visible');
            if (entry.target.classList.contains('gallery-section')) {
              entry.target.querySelectorAll('.world-card').forEach((node) => {
                node.classList.add('is-visible');
              });
            }
            if (entry.target.classList.contains('teaser-section')) {
              startTeaserSequence();
            }
            observer.unobserve(entry.target);
          });
        }, {
          threshold: 0.16
        });

        revealNodes.forEach((node) => observer.observe(node));
      }

      function syncHeroMotion() {
        const progress = Math.min(window.scrollY / Math.max(window.innerHeight * 0.45, 1), 1);
        heroFrame.style.setProperty('--hero-shift', `${progress * 16}px`);
        heroFrame.style.opacity = `${1 - progress * 0.08}`;
      }

      function resolveFeedbackEndpoint() {
        const isLocalPreview = (
          (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') &&
          window.location.port &&
          window.location.port !== '8080'
        );
        if (isLocalPreview) {
          return `${window.location.protocol}//${window.location.hostname}:8080/v1/feedback`;
        }
        return '/v1/feedback';
      }

      function setFeedbackFormPending(isPending) {
        feedbackSubmitButton.disabled = isPending;
        feedbackBackButton.disabled = isPending;
        feedbackFileInput.disabled = isPending;
        feedbackNameInput.disabled = isPending;
        feedbackContactInput.disabled = isPending;
        feedbackMessageInput.disabled = isPending;
      }

      function mapFeedbackError(detail) {
        if (
          detail === 'feedback_attachment_too_large' ||
          detail === 'feedback_attachments_total_too_large' ||
          detail === 'feedback_too_many_attachments'
        ) {
          return text.feedbackFilesHint;
        }
        return text.feedbackStatusServerError;
      }

      async function submitFeedbackForm() {
        const name = feedbackNameInput.value.trim();
        const contact = feedbackContactInput.value.trim();
        const message = feedbackMessageInput.value.trim();
        if (!message) {
          feedbackStatus.dataset.state = 'error';
          setFeedbackStatus(text.feedbackStatusError, true);
          feedbackMessageInput.focus();
          return;
        }

        const payload = new FormData();
        payload.append('name', name);
        payload.append('contact', contact);
        payload.append('message', message);
        payload.append('language', currentLanguage);
        payload.append('page_url', window.location.href);
        Array.from(feedbackFileInput.files || []).forEach((file) => {
          payload.append('files', file, file.name);
        });

        feedbackStatus.dataset.state = 'sending';
        setFeedbackStatus(text.feedbackStatusSending, false);
        setFeedbackFormPending(true);

        try {
          const response = await fetch(resolveFeedbackEndpoint(), {
            method: 'POST',
            body: payload
          });
          let detail = '';
          try {
            const responsePayload = await response.json();
            detail = responsePayload && responsePayload.detail ? String(responsePayload.detail) : '';
          } catch (_) {}

          if (!response.ok) {
            throw new Error(detail || 'feedback_send_failed');
          }

          feedbackForm.reset();
          renderSelectedFiles();
          feedbackStatus.dataset.state = 'success';
          setFeedbackStatus(text.feedbackStatusSuccess, false);
        } catch (error) {
          feedbackStatus.dataset.state = 'error';
          setFeedbackStatus(mapFeedbackError(error.message), true);
        } finally {
          setFeedbackFormPending(false);
        }
      }

      persistLanguage();
      syncLanguageUrl();
      if (isYandexCallbackPath && hasYandexLegacyCode && hasYandexLegacyState && !hasYandexHandoff && !hasYandexError) {
        redirectLegacyYandexCallbackToBackend();
        return;
      }
      if (hasYandexHandoff) {
        completeYandexHandoffFromLanding();
        return;
      }
      renderLanding();
      setView(currentView, { updateUrl: false, skipScroll: true });
      window.scrollTo(0, 0);
      syncViewportHeight();
      syncHeroMotion();
      wireRevealEffects();
      runStartupVersionCheck();

      launchButton.addEventListener('click', launchFlutter);
      updateReloadButton.addEventListener('click', function () {
        reloadForUpdate();
      });
      teaserSend.addEventListener('click', function () {
        if (launchInFlight) {
          return;
        }
        startTeaserSequence();
      });
      howButton.addEventListener('click', function () {
        if (launchInFlight) {
          return;
        }
        howAnchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      feedbackCtaButton.addEventListener('click', function () {
        if (launchInFlight) {
          return;
        }
        openFeedbackView();
      });
      feedbackBackButton.addEventListener('click', function () {
        openLandingView();
      });
      feedbackBackLink.addEventListener('click', function (event) {
        event.preventDefault();
        openLandingView();
      });
      legalBackLink.addEventListener('click', function (event) {
        event.preventDefault();
        openLandingView();
      });
      footerLegalNav.addEventListener('click', function (event) {
        const trigger = event.target.closest('[data-legal-tab]');
        if (!trigger) {
          return;
        }
        event.preventDefault();
        openLegalView(trigger.dataset.legalTab, { historyMode: 'push' });
      });
      [legalSidebarNav, legalMobileNav].forEach((host) => {
        host.addEventListener('click', function (event) {
          const trigger = event.target.closest('[data-legal-tab]');
          if (!trigger) {
            return;
          }
          event.preventDefault();
          setLegalTab(trigger.dataset.legalTab, { updateUrl: true, historyMode: 'push' });
        });
      });
      legalArticle.addEventListener('click', function (event) {
        const trigger = event.target.closest('[data-legal-tab]');
        if (!trigger) {
          return;
        }
        event.preventDefault();
        setLegalTab(trigger.dataset.legalTab, { updateUrl: true, historyMode: 'push' });
      });
      feedbackForm.addEventListener('submit', function (event) {
        event.preventDefault();
        submitFeedbackForm();
      });
      feedbackFileInput.addEventListener('change', renderSelectedFiles);
      languageRuButton.addEventListener('click', function () {
        if (launchInFlight) {
          return;
        }
        applyLanguage('ru');
      });
      languageEnButton.addEventListener('click', function () {
        if (launchInFlight) {
          return;
        }
        applyLanguage('en');
      });

      window.addEventListener('codex:flutter-first-frame', finishLaunchTransition);
      window.addEventListener('codex:flutter-ready', finishLaunchTransition);
      window.addEventListener('resize', syncViewportHeight);
      window.addEventListener('scroll', syncHeroMotion, { passive: true });
      window.addEventListener('orientationchange', refreshViewportMetrics);
      window.addEventListener('focus', refreshViewportMetrics);
      window.addEventListener('pageshow', function () {
        refreshViewportMetrics();
        runStartupVersionCheck();
      });
      window.addEventListener('popstate', function () {
        const params = new URLSearchParams(window.location.search);
        currentView = resolveView(params.get('view'));
        currentLegalTab = resolveLegalTab(params.get('tab'));
        setView(currentView, { updateUrl: false, skipScroll: true });
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
          window.setTimeout(refreshViewportMetrics, 0);
          window.setTimeout(refreshViewportMetrics, 180);
        }
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewportHeight);
        window.visualViewport.addEventListener('scroll', syncViewportHeight);
      }

      window.addEventListener('error', function () {
        if (launchInFlight && !launchCompleted) {
          resetLaunchState(text.startupError);
        }
      });

      if (shouldAutoLaunch) {
        window.setTimeout(launchFlutter, 0);
      }

      window.__codexHideLanding = function () {
        loadingContainer.remove();
      };
    })();
  </script>
</body>
</html>
