<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17121F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ai_prg">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ai_prg</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Splash screen — AetherPalette.background (#17121F), виден до монтирования Flutter */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      overflow: hidden;
      background: #17121F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      position: relative;
      z-index: 1;
    }
    .loader {
      width: 52px;
      height: 52px;
      border: 3px solid rgba(58, 47, 73, 0.5);
      border-top-color: #B463FF;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .loader-label {
      color: #E9E2D7;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .loader-note {
      max-width: 20rem;
      color: rgba(233, 226, 215, 0.72);
      font-size: 0.92rem;
      line-height: 1.45;
      text-align: center;
    }
    .loader-note.is-error {
      color: #ffb4ab;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="loader" aria-hidden="true"></div>
    <span class="loader-label">AI RPG</span>
    <span id="loading-note" class="loader-note">
      Loading the app...
    </span>
  </div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    (function () {
      const loadingContainer = document.getElementById('loading-container');
      const loadingNote = document.getElementById('loading-note');

      function setLoadingNote(message, isError) {
        if (!loadingNote) {
          return;
        }
        loadingNote.textContent = message;
        loadingNote.classList.toggle('is-error', Boolean(isError));
      }

      function hideLoading() {
        if (loadingContainer) {
          loadingContainer.remove();
        }
      }

      const slowLoadTimer = window.setTimeout(() => {
        setLoadingNote(
          'Loading is taking longer than usual. If this is a phone browser, please wait a few more seconds.',
          false,
        );
      }, 8000);

      const failedLoadTimer = window.setTimeout(() => {
        setLoadingNote(
          'The app did not finish starting. Please reload the page. If it keeps happening, open it in Chrome or Safari.',
          true,
        );
      }, 20000);

      window.addEventListener('error', function () {
        window.clearTimeout(slowLoadTimer);
        window.clearTimeout(failedLoadTimer);
        setLoadingNote(
          'A startup error occurred. Please reload the page.',
          true,
        );
      });

      _flutter.loader.load({
        onEntrypointLoaded: async function (engineInitializer) {
          try {
            const appRunner = await engineInitializer.initializeEngine();
            hideLoading();
            window.clearTimeout(slowLoadTimer);
            window.clearTimeout(failedLoadTimer);
            await appRunner.runApp();
          } catch (error) {
            console.error('Flutter web bootstrap failed', error);
            window.clearTimeout(slowLoadTimer);
            window.clearTimeout(failedLoadTimer);
            setLoadingNote(
              'The app could not start in this browser. Please reload the page.',
              true,
            );
          }
        },
      });
    })();
  </script>
</body>
</html>
