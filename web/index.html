<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="Нарративная ИИ-RPG, где история отвечает на каждый ваш выбор."
  >
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0908">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Стирая Грань">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Стирая Грань</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --app-height: 100vh;
      --bg: #0a0908;
      --bg-top: #141210;
      --surface: rgba(16, 13, 11, 0.92);
      --surface-soft: rgba(26, 24, 22, 0.9);
      --surface-strong: rgba(12, 10, 9, 0.96);
      --border: rgba(200, 121, 65, 0.22);
      --border-soft: rgba(255, 255, 255, 0.06);
      --text: #e8e4e0;
      --muted: #837b74;
      --dim: #5b5550;
      --accent: #c87941;
      --accent-hover: #d4956a;
      --gold: #bfa76f;
      --danger: #ffb4ab;
      --radius-xl: 30px;
      --radius-lg: 22px;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      color-scheme: dark;
      font-family: "Inter", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: var(--app-height);
      background:
        radial-gradient(circle at 50% 22%, rgba(200, 121, 65, 0.17), transparent 40%),
        linear-gradient(180deg, var(--bg-top), var(--bg));
      color: var(--text);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.014) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.014) 1px, transparent 1px);
      background-size: 140px 140px;
      mask-image: radial-gradient(circle at center, black, transparent 82%);
      pointer-events: none;
      opacity: 0.38;
    }

    [hidden] {
      display: none !important;
    }

    #loading-container {
      position: relative;
      z-index: 1;
      min-height: var(--app-height);
      padding: 0 20px 48px;
      opacity: 1;
      transition: opacity 420ms ease, transform 420ms ease;
    }

    #loading-container.is-exiting {
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
    }

    .landing-shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 26px 0 40px;
    }

    .landing-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 6px 4px 22px;
    }

    .landing-tagline {
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .language-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border-radius: 999px;
      border: 1px solid rgba(191, 167, 111, 0.2);
      background: rgba(12, 10, 9, 0.78);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.24);
    }

    .language-button {
      min-width: 72px;
      padding: 10px 16px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .language-button:hover {
      color: var(--text);
      transform: translateY(-1px);
    }

    .language-button.is-active {
      background: rgba(191, 167, 111, 0.14);
      color: #f1e7d6;
      box-shadow: inset 0 0 0 1px rgba(191, 167, 111, 0.32);
    }

    .language-button:disabled {
      cursor: default;
      opacity: 0.65;
      transform: none;
    }

    .hero-section {
      position: relative;
      display: grid;
      padding: 12px 0 56px;
    }

    .hero-frame {
      position: relative;
      min-height: 620px;
      padding: clamp(36px, 5vw, 64px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 30px;
      background: rgba(18, 15, 13, 0.94);
      box-shadow: var(--shadow);
    }

    .hero-copy {
      max-width: 720px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 52px;
      height: 1px;
      background: rgba(200, 121, 65, 0.48);
    }

    .brand-mark {
      margin: 18px 0 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(56px, 10vw, 110px);
      line-height: 0.9;
      font-weight: 500;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }

    .brand-subtitle {
      margin: 12px 0 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(22px, 3.4vw, 34px);
      line-height: 1.2;
      color: #efe6d9;
      font-style: italic;
    }

    .hero-description {
      margin: 20px 0 0;
      max-width: 560px;
      font-size: 16px;
      line-height: 1.8;
      color: var(--muted);
    }

    .hero-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
      margin-bottom: 30px;
    }

    .hero-pill {
      padding: 11px 15px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(10, 9, 8, 0.52);
      backdrop-filter: blur(8px);
      color: #d7cec7;
      font-size: 13px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .hero-launch-shell {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .section {
      position: relative;
      opacity: 0;
      transform: translateY(44px);
      transition: opacity 560ms ease, transform 560ms ease;
    }

    .section.is-visible,
    .section.is-hero {
      opacity: 1;
      transform: none;
    }

    .teaser-section,
    .tech-section {
      margin-top: 34px;
      padding: clamp(22px, 3vw, 34px);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(18, 15, 13, 0.98), rgba(10, 9, 8, 0.95));
      box-shadow: var(--shadow);
    }

    .teaser-chat {
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      gap: 22px;
    }

    #teaser-messages {
      display: grid;
      gap: 18px;
    }

    .teaser-bubble {
      padding: 20px 20px 20px 90px;
      border-radius: 22px;
      border: 1px solid rgba(191, 167, 111, 0.26);
      background: var(--surface-soft);
      position: relative;
      min-height: 104px;
      will-change: transform, opacity;
    }

    .teaser-bubble.is-player {
      padding: 20px 22px;
      margin-left: auto;
      max-width: 84%;
      border-color: rgba(200, 121, 65, 0.34);
      background: rgba(200, 121, 65, 0.12);
    }

    .teaser-bubble.is-system {
      padding: 18px 20px;
      min-height: auto;
      border-style: dashed;
      border-color: rgba(191, 167, 111, 0.24);
      background: rgba(191, 167, 111, 0.08);
    }

    .teaser-bubble.is-system .bubble-text::after {
      content: "";
      animation: storyDots 1.2s steps(3, end) infinite;
    }

    .teaser-avatar {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 54px;
      height: 54px;
      border-radius: 999px;
      overflow: hidden;
      border: 2px solid rgba(191, 167, 111, 0.44);
      background: #0c0a09;
      box-shadow: 0 0 0 4px rgba(191, 167, 111, 0.08);
    }

    .teaser-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      display: block;
    }

    .bubble-author {
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
    }

    .bubble-author:empty {
      display: none;
    }

    .bubble-text {
      margin: 0;
      font-size: 16px;
      line-height: 1.65;
      color: var(--text);
      min-height: 26px;
    }

    .teaser-input-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      margin-top: 8px;
      padding: 10px;
      border-radius: 22px;
      border: 1px solid rgba(191, 167, 111, 0.18);
      background: rgba(13, 11, 10, 0.95);
    }

    .teaser-input {
      width: 100%;
      padding: 14px 14px 14px 16px;
      font-size: 16px;
      color: var(--text);
      min-height: 52px;
      display: flex;
      align-items: center;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.02);
      user-select: none;
    }

    .teaser-input.is-placeholder {
      color: var(--dim);
    }

    .teaser-send.is-pressed {
      transform: translateY(1px) scale(0.98);
      opacity: 0.88;
    }

    .typing-caret::after {
      content: "";
      display: inline-block;
      width: 1px;
      height: 1.05em;
      margin-left: 3px;
      background: currentColor;
      vertical-align: -0.12em;
      animation: caretBlink 1s step-end infinite;
    }

    .button-primary,
    .button-secondary {
      appearance: none;
      border-radius: 14px;
      padding: 16px 22px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, opacity 160ms ease, box-shadow 160ms ease;
    }

    .button-primary {
      border: 0;
      background: linear-gradient(180deg, #d4ba7e, var(--gold));
      color: #0c0a09;
      box-shadow: 0 0 36px rgba(191, 167, 111, 0.24);
    }

    .button-secondary {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(14, 12, 10, 0.9);
      color: var(--text);
    }

    .button-primary:hover,
    .button-secondary:hover {
      transform: translateY(-1px);
    }

    .button-primary:disabled,
    .button-secondary:disabled {
      opacity: 0.72;
      cursor: progress;
      transform: none;
    }

    .teaser-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .loading-shell {
      width: min(540px, 100%);
      display: none;
      gap: 14px;
      margin: 18px auto 0;
      padding: 18px 18px 16px;
      border-radius: 18px;
      border: 1px solid rgba(191, 167, 111, 0.26);
      background: rgba(14, 12, 10, 0.96);
    }

    .loading-shell.is-visible {
      display: grid;
    }

    .loading-shell.is-error {
      border-color: rgba(255, 180, 171, 0.6);
    }

    .loading-shell-top {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .loading-spinner {
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 2px solid rgba(200, 121, 65, 0.2);
      border-top-color: var(--accent);
      animation: spin 900ms linear infinite;
      flex: 0 0 auto;
    }

    .loading-copy {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .loading-title,
    .loading-stage,
    .loading-flavor,
    .launch-note {
      margin: 0;
    }

    .loading-title {
      font-size: 16px;
      line-height: 1.35;
    }

    .loading-stage,
    .launch-note {
      font-size: 14px;
      line-height: 1.55;
      color: var(--muted);
    }

    .loading-progress-track {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(233, 226, 215, 0.08);
      overflow: hidden;
    }

    .loading-progress-fill {
      height: 100%;
      width: 12%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-hover), var(--accent));
      box-shadow: 0 0 18px rgba(200, 121, 65, 0.25);
      transition: width 500ms ease;
    }

    .loading-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }

    .loading-flavor {
      min-height: 22px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--gold);
      letter-spacing: 0.02em;
    }

    .launch-note {
      margin-top: 14px;
      min-height: 24px;
      text-align: center;
    }

    .launch-note.is-error {
      color: var(--danger);
    }

    .gallery-section {
      margin-top: 38px;
    }

    .section-title {
      margin: 0;
      text-align: center;
      font-family: "Playfair Display", serif;
      font-size: clamp(34px, 5vw, 60px);
      line-height: 1;
      text-transform: uppercase;
    }

    .world-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-top: 28px;
    }

    .world-card {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid rgba(191, 167, 111, 0.18);
      background: rgba(14, 12, 10, 0.94);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 560ms ease, transform 560ms ease, box-shadow 220ms ease, border-color 220ms ease;
    }

    .world-card.is-visible {
      opacity: 1;
      transform: none;
    }

    .world-card:hover {
      border-color: rgba(191, 167, 111, 0.38);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.5);
    }

    .world-art {
      position: relative;
      aspect-ratio: 0.82;
      overflow: hidden;
    }

    .world-art img {
      width: calc(100% + 24px);
      height: calc(100% + 26px);
      object-fit: cover;
      object-position: center top;
      transform: translate(-12px, -22px) scale(1.08);
      transform-origin: center top;
      display: block;
    }

    .world-art::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 9, 8, 0.02), rgba(10, 9, 8, 0.82));
    }

    .world-body {
      padding: 18px;
      display: grid;
      grid-template-rows: minmax(72px, auto) minmax(104px, auto) auto;
      gap: 12px;
      flex: 1;
    }

    .world-title {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: 34px;
      line-height: 0.96;
      text-transform: uppercase;
    }

    .world-description {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }

    .world-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
    }

    .world-tag {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.05em;
    }

    .tech-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-top: 22px;
    }

    .tech-card {
      padding: 22px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.025);
    }

    .tech-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
    }

    .tech-copy {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 15px;
    }

    .landing-footer {
      margin-top: 36px;
      padding: 22px 8px 10px;
      border-top: 1px solid rgba(191, 167, 111, 0.16);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: start;
    }

    .footer-brand {
      min-width: 0;
    }

    .footer-brand-name {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(26px, 4vw, 38px);
      line-height: 0.95;
      color: var(--text);
    }

    .footer-brand-copy {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .footer-contacts {
      display: grid;
      gap: 12px;
      justify-items: start;
    }

    .footer-contacts-title {
      margin: 0;
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .footer-contact-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      text-decoration: none;
      transition: color 180ms ease, transform 180ms ease;
    }

    .footer-contact-link:hover {
      color: #f0d9b7;
      transform: translateY(-1px);
    }

    .footer-contact-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: var(--accent);
    }

    .footer-contact-meta {
      display: grid;
      gap: 2px;
    }

    .footer-contact-label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .footer-contact-value {
      color: inherit;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes caretBlink {
      50% { opacity: 0; }
    }

    @keyframes storyDots {
      0% { content: ""; }
      33% { content: "."; }
      66% { content: ".."; }
      100% { content: "..."; }
    }

    @media (max-width: 980px) {
      .world-grid,
      .tech-grid {
        grid-template-columns: 1fr;
        display: grid;
      }

      .landing-footer {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      #loading-container {
        padding: 0 14px 34px;
      }

      .landing-shell {
        padding-top: 18px;
      }

      .hero-section {
        min-height: auto;
        padding: 10px 0 28px;
      }

      .teaser-input-shell {
        grid-template-columns: 1fr;
      }

      .teaser-bubble.is-player {
        max-width: 100%;
      }
    }

    @media (max-width: 560px) {
      .landing-topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .language-toggle {
        width: 100%;
      }

      .language-button {
        flex: 1;
      }

      .hero-frame,
      .teaser-section,
      .tech-section {
        border-radius: 24px;
      }

      .hero-actions,
      .hero-launch-shell,
      .teaser-actions {
        width: 100%;
      }

      .button-primary,
      .button-secondary {
        width: 100%;
      }

      .world-title {
        font-size: 28px;
      }

      .loading-meta {
        flex-direction: column;
        align-items: flex-start;
      }

      .footer-contact-link {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <main class="landing-shell">
      <header class="landing-topbar">
        <div id="landing-tagline" class="landing-tagline"></div>
        <div class="language-toggle" aria-label="Language switcher">
          <button id="language-ru" class="language-button" type="button" data-language-button="ru">РУС</button>
          <button id="language-en" class="language-button" type="button" data-language-button="en">ENG</button>
        </div>
      </header>

      <section class="hero-section section is-hero">
        <div id="hero-frame" class="hero-frame">
          <div class="hero-copy">
            <div id="landing-eyebrow" class="eyebrow"></div>
            <h1 id="landing-brand" class="brand-mark"></h1>
            <p id="landing-title" class="brand-subtitle"></p>
            <p id="landing-subtitle" class="hero-description"></p>
            <div id="landing-pills" class="hero-pills"></div>
            <div class="hero-actions">
              <div id="hero-launch-shell" class="hero-launch-shell">
                <button id="launch-button" class="button-primary" type="button"></button>
                <button id="how-button" class="button-secondary" type="button"></button>
              </div>
            </div>
            <section id="loading-shell" class="loading-shell" aria-live="polite" hidden>
              <div class="loading-shell-top">
                <div class="loading-spinner" aria-hidden="true"></div>
                <div class="loading-copy">
                  <p id="loading-title" class="loading-title"></p>
                  <p id="loading-stage" class="loading-stage"></p>
                </div>
              </div>
              <div class="loading-progress-track" aria-hidden="true">
                <div id="loading-progress-fill" class="loading-progress-fill"></div>
              </div>
              <div class="loading-meta">
                <span id="loading-progress-label"></span>
                <span id="loading-eta"></span>
              </div>
              <p id="loading-flavor" class="loading-flavor"></p>
            </section>
            <p id="loading-note" class="launch-note" aria-live="polite"></p>
          </div>
        </div>
      </section>

      <section class="teaser-section section" data-reveal>

      const stageProgress = [0.12, 0.34, 0.58, 0.8, 1];
      const supportedLanguages = ['ru', 'en'];
      const languageStorageKey = 'aether.landing_language';

      const loadingContainer = document.getElementById('loading-container');
      const heroFrame = document.getElementById('hero-frame');
      const teaserMessagesHost = document.getElementById('teaser-messages');
      const teaserInput = document.getElementById('teaser-input');
      const teaserSend = document.getElementById('teaser-send');
      const heroLaunchShell = document.getElementById('hero-launch-shell');
      const loadingShell = document.getElementById('loading-shell');
      const loadingTitle = document.getElementById('loading-title');
      const loadingStage = document.getElementById('loading-stage');
      const loadingEta = document.getElementById('loading-eta');
      const loadingFlavor = document.getElementById('loading-flavor');
      const loadingProgressFill = document.getElementById('loading-progress-fill');
      const loadingProgressLabel = document.getElementById('loading-progress-label');
      const loadingNote = document.getElementById('loading-note');
      const launchButton = document.getElementById('launch-button');
      const howButton = document.getElementById('how-button');
      const howAnchor = document.getElementById('how-anchor');
      const languageRuButton = document.getElementById('language-ru');
      const languageEnButton = document.getElementById('language-en');
      const languageButtons = [languageRuButton, languageEnButton];
      const urlParams = new URLSearchParams(window.location.search);
      const shouldAutoLaunch = urlParams.get('autostart') === '1';

      let currentLanguage = resolveInitialLanguage();
      let text = copy[currentLanguage];

      let launchInFlight = false;
      let launchCompleted = false;
      let flavorTimer = null;
      let slowLoadTimer = null;
      let currentStageIndex = 0;
      let currentFlavorIndex = 0;
      let launchStartedAt = 0;
      let teaserSequenceStarted = false;
      let teaserSequenceToken = 0;
      let nextTeaserMessageId = 0;
      let teaserMessages = [createTeaserMessage('narrator', '')];

      function parseLanguage(value) {
        return supportedLanguages.includes(value) ? value : null;
      }

      function resolveInitialLanguage() {
        const urlLanguage = parseLanguage(urlParams.get('lang'));
        if (urlLanguage) {
          return urlLanguage;
        }
        try {
          const storedLanguage = parseLanguage(window.localStorage.getItem(languageStorageKey));
          if (storedLanguage) {
            return storedLanguage;
          }
        } catch (_) {}
        return 'ru';
      }

      function syncLanguageUrl() {
        const nextParams = new URLSearchParams(window.location.search);
        nextParams.set('lang', currentLanguage);
        const nextQuery = nextParams.toString();
        const nextUrl = `${window.location.pathname}${nextQuery ? `?${nextQuery}` : ''}${window.location.hash}`;
        window.history.replaceState({}, '', nextUrl);
      }

      function persistLanguage() {
        try {
          window.localStorage.setItem(languageStorageKey, currentLanguage);
        } catch (_) {}
      }

      function updateLanguageToggle() {
        languageButtons.forEach((button) => {
          const isActive = button.dataset.languageButton === currentLanguage;
          button.classList.toggle('is-active', isActive);
          button.setAttribute('aria-pressed', String(isActive));
        });
      }

      function setText(id, value) {
        const node = document.getElementById(id);
        if (node) {
          node.textContent = value;
        }
      }

      function createTeaserMessage(role, textValue, extra) {
        return {
          id: `teaser-${nextTeaserMessageId++}`,
          role: role,
          text: textValue,
          ...(extra || {})
        };
      }

      function resetTeaserState() {
        teaserSequenceToken += 1;
        teaserSequenceStarted = false;
        nextTeaserMessageId = 0;
        teaserMessages = [createTeaserMessage('narrator', '')];
        teaserSend.classList.remove('is-pressed');
        teaserInput.textContent = text.teaserPlaceholder;
        teaserInput.classList.add('is-placeholder');
        renderTeaserMessages();
      }

      function updateTeaserBubbleNode(bubble, message) {
        bubble.className = `teaser-bubble${message.role === 'player' ? ' is-player' : ''}${message.role === 'system' ? ' is-system' : ''}`;
        bubble.dataset.messageId = message.id;

        let avatar = bubble.querySelector('.teaser-avatar');
        if (message.role === 'narrator') {
          if (!avatar) {
            avatar = document.createElement('div');
            avatar.className = 'teaser-avatar';
            avatar.innerHTML = '<img src="landing/master_img.jpg" alt="">';
            bubble.appendChild(avatar);
          }
        } else if (avatar) {
          avatar.remove();
        }

        let author = bubble.querySelector('.bubble-author');
        if (!author) {
          author = document.createElement('p');
          author.className = 'bubble-author';
          bubble.appendChild(author);
        }
        author.textContent = message.role === 'narrator'
          ? text.teaserNarrator
          : (message.role === 'player' ? text.playerLabel : '');

        let content = bubble.querySelector('.bubble-text');
        if (!content) {
          content = document.createElement('p');
          content.className = 'bubble-text';
          bubble.appendChild(content);
        }
        content.textContent = message.text;
        content.classList.toggle('typing-caret', Boolean(message.typing));
      }

      function animateTeaserEntry(node, role) {
        const keyframes = role === 'player'
          ? [
              { opacity: 0, transform: 'translate3d(0, 28px, 0) scale(0.985)', filter: 'blur(10px)' },
              { opacity: 1, transform: 'translate3d(0, 0, 0) scale(1)', filter: 'blur(0)' }
            ]
          : [
              { opacity: 0, transform: 'translate3d(0, 22px, 0) scale(0.99)', filter: 'blur(12px)' },
              { opacity: 1, transform: 'translate3d(0, 0, 0) scale(1)', filter: 'blur(0)' }
            ];

        node.animate(keyframes, {
          duration: 560,
          easing: 'cubic-bezier(0.22, 1, 0.36, 1)',
          fill: 'both'
        });
      }

      function renderTeaserMessages() {
        const previousPositions = new Map();
        const existingNodes = new Map();

        Array.from(teaserMessagesHost.children).forEach((node) => {
          previousPositions.set(node.dataset.messageId, node.getBoundingClientRect());
          existingNodes.set(node.dataset.messageId, node);
        });

        const nextNodes = teaserMessages.map((message) => {
          const bubble = existingNodes.get(message.id) || document.createElement('article');
          updateTeaserBubbleNode(bubble, message);
          return bubble;
        });

        Array.from(existingNodes.entries()).forEach(([messageId, node]) => {
          if (!teaserMessages.some((message) => message.id === messageId)) {
            node.remove();
          }
        });

        nextNodes.forEach((node) => {
          teaserMessagesHost.appendChild(node);
        });

        window.requestAnimationFrame(() => {
          nextNodes.forEach((node) => {
            const messageId = node.dataset.messageId;
            const previousRect = previousPositions.get(messageId);
            const nextRect = node.getBoundingClientRect();

            if (!previousRect) {
              const message = teaserMessages.find((item) => item.id === messageId);
              animateTeaserEntry(node, message ? message.role : 'narrator');
              return;
            }

            const deltaX = previousRect.left - nextRect.left;
            const deltaY = previousRect.top - nextRect.top;

            if (Math.abs(deltaX) > 0.5 || Math.abs(deltaY) > 0.5) {
              node.animate(
                [
                  { transform: `translate3d(${deltaX}px, ${deltaY}px, 0)` },
                  { transform: 'translate3d(0, 0, 0)' }
                ],
                {
                  duration: 520,
                  easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
                }
              );
            }
          });
        });
      }

      function renderWorlds() {
        const grid = document.getElementById('world-grid');
        grid.innerHTML = '';
        text.worlds.forEach((world, index) => {
          const card = document.createElement('article');
          card.className = 'world-card';
          card.style.transitionDelay = `${index * 90}ms`;
          card.innerHTML = `
            <div class="world-art">
              <img src="${world.image}" alt="${world.title}">
            </div>
            <div class="world-body">
              <h3 class="world-title">${world.title}</h3>
              <p class="world-description">${world.description}</p>
              <div class="world-tags">
                ${world.tags.map((tag) => `<span class="world-tag">${tag}</span>`).join('')}
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      }

      function renderTechCards() {
        const grid = document.getElementById('tech-grid');
        grid.innerHTML = '';
        text.tech.forEach((item) => {
          const card = document.createElement('article');
          card.className = 'tech-card';
          card.innerHTML = `
            <h3 class="tech-title">${item.title}</h3>
            <p class="tech-copy">${item.copy}</p>
          `;
          grid.appendChild(card);
        });
      }

      function syncRenderedSectionState() {
        const teaserSection = document.querySelector('.teaser-section');
        const gallerySection = document.querySelector('.gallery-section');

        if (gallerySection && gallerySection.classList.contains('is-visible')) {
          gallerySection.querySelectorAll('.world-card').forEach((node) => {
            node.classList.add('is-visible');
          });
        }

        if (
          teaserSection &&
          teaserSection.classList.contains('is-visible') &&
          !launchInFlight
        ) {
          window.setTimeout(startTeaserSequence, 60);
        }
      }

      function renderLanding(options) {
        document.documentElement.lang = currentLanguage;
        document.title = text.brand;
        setText('landing-tagline', text.pageTagline.toUpperCase());
        setText('landing-eyebrow', text.eyebrow);
        setText('landing-brand', text.brand);
        setText('landing-title', text.heroTitle);
        setText('landing-subtitle', text.heroSubtitle);
        setText('gallery-title', text.galleryTitle);
        setText('tech-title', text.techTitle);
        setText('footer-brand-name', text.brand);
        setText('footer-brand-copy', text.footerBrandCopy);
        setText('footer-contacts-title', text.footerContactsTitle);
        setText('footer-email-label', text.footerEmailLabel);
        setText('footer-telegram-label', text.footerTelegramLabel);
        launchButton.textContent = text.launch;
        howButton.textContent = text.how;
        teaserSend.textContent = text.teaserSend;
        updateLanguageToggle();

        const pillHost = document.getElementById('landing-pills');
        pillHost.innerHTML = '';
        text.pills.forEach((entry) => {
          const pill = document.createElement('span');
          pill.className = 'hero-pill';
          pill.textContent = entry;
          pillHost.appendChild(pill);
        });

        if (options && options.preserveTeaser) {
          renderTeaserMessages();
        } else {
          resetTeaserState();
        }
        renderWorlds();
        renderTechCards();
        syncRenderedSectionState();
      }

      function applyLanguage(language, options) {
        const nextLanguage = parseLanguage(language);
        if (!nextLanguage || nextLanguage === currentLanguage) {
          return;
        }
        currentLanguage = nextLanguage;
        text = copy[currentLanguage];
        persistLanguage();
        syncLanguageUrl();
        renderLanding({ preserveTeaser: options && options.preserveTeaser });
      }

      function setLoadingNote(message, isError) {
        loadingNote.textContent = message || '';
        loadingNote.classList.toggle('is-error', Boolean(isError));
      }

      function syncViewportHeight() {
        const viewport = window.visualViewport;
        const nextHeight = viewport ? viewport.height : window.innerHeight;
        const height = `${Math.round(nextHeight)}px`;
        document.documentElement.style.setProperty('--app-height', height);
        document.documentElement.style.height = height;
        document.body.style.minHeight = height;
      }

      function refreshViewportMetrics() {
        syncViewportHeight();
        window.dispatchEvent(new Event('resize'));
      }

      function clearLaunchTimers() {
        if (flavorTimer !== null) {
          window.clearInterval(flavorTimer);
          flavorTimer = null;
        }
        if (slowLoadTimer !== null) {
          window.clearTimeout(slowLoadTimer);
          slowLoadTimer = null;
        }
      }

      function setInteractiveState(disabled) {
        launchButton.disabled = disabled;
        howButton.disabled = disabled;
        teaserSend.disabled = disabled;
        languageButtons.forEach((button) => {
          button.disabled = disabled;
        });
      }

      function showLoadingShell() {
        heroLaunchShell.hidden = true;
        loadingShell.hidden = false;
        loadingShell.classList.add('is-visible');
      }

      function showLaunchButtons() {
        heroLaunchShell.hidden = false;
        loadingShell.hidden = true;
        loadingShell.classList.remove('is-visible');
        loadingShell.classList.remove('is-error');
      }

      function setStage(stageIndex, options) {
        currentStageIndex = Math.max(0, Math.min(stageIndex, text.loadingStages.length - 1));
        const progress = stageProgress[Math.min(currentStageIndex, stageProgress.length - 1)];
        loadingTitle.textContent = text.loadingTitle;
        loadingStage.textContent = text.loadingStages[currentStageIndex];
        loadingEta.textContent = options && options.longEta ? text.loadingEtaLong : text.loadingEtaShort;
        loadingProgressFill.style.width = `${Math.round(progress * 100)}%`;
        loadingProgressLabel.textContent = `${Math.round(progress * 100)}%`;
      }

      function startFlavorRotation() {
        currentFlavorIndex = 0;
        loadingFlavor.textContent = text.loadingFlavorLines[currentFlavorIndex];
        flavorTimer = window.setInterval(() => {
          currentFlavorIndex = (currentFlavorIndex + 1) % text.loadingFlavorLines.length;
          loadingFlavor.textContent = text.loadingFlavorLines[currentFlavorIndex];
        }, 2200);
      }

      function enterLaunchState() {
        launchStartedAt = Date.now();
        showLoadingShell();
        setInteractiveState(true);
        loadingShell.classList.remove('is-error');
        setLoadingNote('', false);
        setStage(0);
        startFlavorRotation();
        slowLoadTimer = window.setTimeout(() => {
          if (!launchInFlight || launchCompleted) {
            return;
          }
          loadingEta.textContent = text.loadingEtaLong;
          setLoadingNote(text.loadingSlow, false);
        }, 8000);
      }

      function resetLaunchState(message) {
        clearLaunchTimers();
        launchInFlight = false;
        launchCompleted = false;
        setInteractiveState(false);
        showLaunchButtons();
        if (message) {
          setLoadingNote(message, true);
        }
      }

      function finishLaunchTransition() {
        if (launchCompleted) {
          return;
        }
        launchCompleted = true;
        clearLaunchTimers();
        setStage(text.loadingStages.length - 1, { longEta: true });
        loadingFlavor.textContent = text.loadingFlavorLines[currentFlavorIndex % text.loadingFlavorLines.length];
        setLoadingNote('', false);
        const elapsed = Date.now() - launchStartedAt;
        const remaining = Math.max(0, 650 - elapsed);
        window.setTimeout(() => {
          loadingContainer.classList.add('is-exiting');
          window.setTimeout(() => {
            loadingContainer.remove();
          }, 460);
        }, remaining);
      }

      async function launchFlutter() {
        if (launchInFlight) {
          return;
        }

        launchInFlight = true;
        enterLaunchState();

        try {
          const start = window.__codexLaunchFlutterApp || (window._flutter && window._flutter.loader
            ? function () {
                return window._flutter.loader.load({
                  onEntrypointLoaded: async function (engineInitializer) {
                    if (launchInFlight && !launchCompleted) {
                      setStage(1);
                    }
                    const appRunner = await engineInitializer.initializeEngine();
                    if (launchInFlight && !launchCompleted) {
                      setStage(2);
                    }
                    const runResult = await appRunner.runApp();
                    if (launchInFlight && !launchCompleted) {
                      setStage(3, { longEta: true });
                    }
                    return runResult;
                  }
                });
              }
            : null);

          if (!start) {
            throw new Error('Flutter loader is unavailable');
          }

          await start();
        } catch (error) {
          console.error('Flutter web bootstrap failed', error);
          resetLaunchState(text.loadingRetry);
        }
      }

      function typeText(target, textValue, speed, runToken) {
        return new Promise((resolve) => {
          let index = 0;
          target.textContent = '';
          target.classList.add('typing-caret');
          const timer = window.setInterval(() => {
            if (runToken !== teaserSequenceToken) {
              window.clearInterval(timer);
              target.classList.remove('typing-caret');
              resolve(false);
              return;
            }
            index += 1;
            target.textContent = textValue.slice(0, index);
            if (index >= textValue.length) {
              window.clearInterval(timer);
              target.classList.remove('typing-caret');
              resolve(true);
            }
          }, speed);
        });
      }

      function wait(ms, runToken) {
        return new Promise((resolve) => {
          window.setTimeout(() => {
            resolve(runToken === teaserSequenceToken);
          }, ms);
        });
      }

      async function startTeaserSequence() {
        if (teaserSequenceStarted) {
          return;
        }
        teaserSequenceStarted = true;
        const runToken = ++teaserSequenceToken;

        const narratorMessage = teaserMessages[0];
        narratorMessage.typing = true;
        renderTeaserMessages();
        const narratorTextNode = teaserMessagesHost.querySelector('.teaser-bubble .bubble-text');
        if (!narratorTextNode) {
          teaserSequenceStarted = false;
          return;
        }
        if (!(await typeText(narratorTextNode, text.teaserPrompt, 28, runToken))) {
          return;
        }
        if (runToken !== teaserSequenceToken) {
          return;
        }
        narratorMessage.text = text.teaserPrompt;
        narratorMessage.typing = false;
        renderTeaserMessages();

        if (!(await wait(280, runToken))) {
          return;
        }
        teaserInput.classList.remove('is-placeholder');
        if (!(await typeText(teaserInput, text.teaserPreviewInput, 36, runToken))) {
          return;
        }

        if (!(await wait(260, runToken))) {
          return;
        }
        teaserSend.classList.add('is-pressed');
        if (!(await wait(160, runToken))) {
          teaserSend.classList.remove('is-pressed');
          return;
        }
        teaserSend.classList.remove('is-pressed');

        teaserMessages.push(createTeaserMessage('player', text.teaserPreviewInput));
        teaserInput.textContent = text.teaserPlaceholder;
        teaserInput.classList.add('is-placeholder');
        renderTeaserMessages();

        if (!(await wait(240, runToken))) {
          return;
        }
        teaserMessages.push(
          createTeaserMessage('system', text.teaserGenerating, { typing: true })
        );
        renderTeaserMessages();
      }

      function wireRevealEffects() {
        const revealNodes = Array.from(document.querySelectorAll('[data-reveal]'));
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) {
              return;
            }
            entry.target.classList.add('is-visible');
            if (entry.target.classList.contains('gallery-section')) {
              entry.target.querySelectorAll('.world-card').forEach((node) => {
                node.classList.add('is-visible');
              });
            }
            if (entry.target.classList.contains('teaser-section')) {
              startTeaserSequence();
            }
            observer.unobserve(entry.target);
          });
        }, {
          threshold: 0.16
        });

        revealNodes.forEach((node) => observer.observe(node));
      }

      function syncHeroMotion() {
        const progress = Math.min(window.scrollY / Math.max(window.innerHeight * 0.45, 1), 1);
        heroFrame.style.setProperty('--hero-shift', `${progress * 16}px`);
        heroFrame.style.opacity = `${1 - progress * 0.08}`;
      }

      persistLanguage();
      syncLanguageUrl();
      renderLanding();
      syncViewportHeight();
      syncHeroMotion();
      wireRevealEffects();

      launchButton.addEventListener('click', launchFlutter);
      teaserSend.addEventListener('click', function () {
        if (launchInFlight) {
          return;
        }
        startTeaserSequence();
      });
      howButton.addEventListener('click', function () {
        if (launchInFlight) {
          return;
        }
        howAnchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      languageRuButton.addEventListener('click', function () {
        if (launchInFlight) {
          return;
        }
        applyLanguage('ru');
      });
      languageEnButton.addEventListener('click', function () {
        if (launchInFlight) {
          return;
        }
        applyLanguage('en');
      });

      window.addEventListener('codex:flutter-first-frame', finishLaunchTransition);
      window.addEventListener('codex:flutter-ready', finishLaunchTransition);
      window.addEventListener('resize', syncViewportHeight);
      window.addEventListener('scroll', syncHeroMotion, { passive: true });
      window.addEventListener('orientationchange', refreshViewportMetrics);
      window.addEventListener('focus', refreshViewportMetrics);
      window.addEventListener('pageshow', refreshViewportMetrics);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
          window.setTimeout(refreshViewportMetrics, 0);
          window.setTimeout(refreshViewportMetrics, 180);
        }
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewportHeight);
        window.visualViewport.addEventListener('scroll', syncViewportHeight);
      }

      window.addEventListener('error', function () {
        if (launchInFlight && !launchCompleted) {
          resetLaunchState(text.startupError);
        }
      });

      if (shouldAutoLaunch) {
        window.setTimeout(launchFlutter, 0);
      }

      window.__codexHideLanding = function () {
        loadingContainer.remove();
      };
    })();
  </script>
</body>
</html>
